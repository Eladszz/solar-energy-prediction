name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solar_backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install --no-cache-dir -c ci-constraints.txt -r backend_requirements.txt

      - name: Run backend tests
        run: python -m pytest tests/ -v --tb=short --cov=app --cov-report=term

      - name: Run Ruff
        run: python -m ruff check app/

      - name: Check Black formatting
        run: python -m black --check --diff app/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solar_frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend type-check
        run: npm run lint

      - name: Build frontend
        run: npm run build
