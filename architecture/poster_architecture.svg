<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">Solar Energy Prediction System Architecture</title>
  <desc id="desc">Poster-ready architecture diagram showing data sources, preprocessing, forecasting models, evaluation, backend API, and web dashboard.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 46px Arial, Helvetica, sans-serif; fill: #102a43; }
      .subtitle { font: 400 22px Arial, Helvetica, sans-serif; fill: #486581; }
      .lane-title { font: 700 24px Arial, Helvetica, sans-serif; fill: #102a43; }
      .box-title { font: 700 21px Arial, Helvetica, sans-serif; fill: #102a43; }
      .box-text { font: 400 17px Arial, Helvetica, sans-serif; fill: #334e68; }
      .tiny { font: 400 15px Arial, Helvetica, sans-serif; fill: #52606d; }
      .lane { stroke-width: 2.5; rx: 22; }
      .box { fill: #ffffff; stroke: #bcccdc; stroke-width: 2; rx: 14; filter: url(#shadow); }
      .chip { fill: #f8fafc; stroke: #d9e2ec; stroke-width: 1.5; rx: 8; }
      .arrow { fill: none; stroke: #334e68; stroke-width: 3; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #829ab1; stroke-width: 2.5; marker-end: url(#arrow-soft); }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#102a43" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334e68"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#829ab1"/>
    </marker>
  </defs>

  <rect class="bg" width="1800" height="1050"/>
  <text class="title" x="90" y="82">Solar Energy Prediction System Architecture</text>
  <text class="subtitle" x="92" y="120">Data Sources -> Preprocessing -> Forecasting Models -> Evaluation -> Web Dashboard</text>

  <rect class="lane" x="70" y="170" width="300" height="660" fill="#e0f2fe" stroke="#38bdf8"/>
  <text class="lane-title" x="105" y="220">Data Sources</text>

  <rect class="lane" x="420" y="170" width="330" height="660" fill="#ecfdf5" stroke="#34d399"/>
  <text class="lane-title" x="455" y="220">Data Preprocessing</text>

  <rect class="lane" x="800" y="170" width="300" height="660" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="lane-title" x="835" y="220">Forecasting Models</text>

  <rect class="lane" x="1150" y="170" width="300" height="660" fill="#f3e8ff" stroke="#a855f7"/>
  <text class="lane-title" x="1185" y="220">Evaluation</text>

  <rect class="lane" x="1500" y="170" width="230" height="660" fill="#ffe4e6" stroke="#fb7185"/>
  <text class="lane-title" x="1535" y="220">Web Dashboard</text>

  <rect class="box" x="115" y="270" width="210" height="95"/>
  <text class="box-title" x="142" y="308">Open-Meteo</text>
  <text class="box-text" x="142" y="336">Forecast weather</text>
  <text class="tiny" x="142" y="360">Hourly irradiance + temp</text>

  <rect class="box" x="115" y="405" width="210" height="95"/>
  <text class="box-title" x="142" y="443">Weather Archive</text>
  <text class="box-text" x="142" y="471">Historical years</text>
  <text class="tiny" x="142" y="495">Training + baseline</text>

  <rect class="box" x="115" y="540" width="210" height="95"/>
  <text class="box-title" x="142" y="578">User Inputs</text>
  <text class="box-text" x="142" y="606">Location, roof area,</text>
  <text class="tiny" x="142" y="630">tilt, CAPEX, tariff</text>

  <rect class="box" x="115" y="675" width="210" height="95"/>
  <text class="box-title" x="142" y="713">Map / Geocoding</text>
  <text class="box-text" x="142" y="741">Address + roof</text>
  <text class="tiny" x="142" y="765">area selection</text>

  <rect class="box" x="470" y="255" width="230" height="85"/>
  <text class="box-title" x="497" y="292">Request Validation</text>
  <text class="tiny" x="497" y="318">Typed FastAPI payloads</text>

  <rect class="box" x="470" y="375" width="230" height="95"/>
  <text class="box-title" x="497" y="413">Weather Profile</text>
  <text class="box-text" x="497" y="441">Forecast year profile</text>
  <text class="tiny" x="497" y="465">Archive, ML, or fallback</text>

  <rect class="box" x="470" y="505" width="230" height="95"/>
  <text class="box-title" x="497" y="543">Cleaning + Alignment</text>
  <text class="box-text" x="497" y="571">Missing values</text>
  <text class="tiny" x="497" y="595">Time features + year fit</text>

  <rect class="box" x="470" y="635" width="230" height="95"/>
  <text class="box-title" x="497" y="673">System Losses</text>
  <text class="box-text" x="497" y="701">Cleanliness + shading</text>
  <text class="tiny" x="497" y="725">Shared loss factor</text>

  <rect class="box" x="845" y="255" width="210" height="100"/>
  <text class="box-title" x="872" y="293">Physical Model</text>
  <text class="box-text" x="872" y="321">PV production stack</text>
  <text class="tiny" x="872" y="345">POA, temperature, clipping</text>

  <rect class="box" x="845" y="415" width="210" height="100"/>
  <text class="box-title" x="872" y="453">ML Model</text>
  <text class="box-text" x="872" y="481">Ridge regression</text>
  <text class="tiny" x="872" y="505">Predicts weather profile</text>

  <rect class="box" x="845" y="575" width="210" height="100"/>
  <text class="box-title" x="872" y="613">Naive Baseline</text>
  <text class="box-text" x="872" y="641">Climatology average</text>
  <text class="tiny" x="872" y="665">Benchmark sanity check</text>

  <rect class="box" x="1195" y="250" width="210" height="90"/>
  <text class="box-title" x="1222" y="288">Energy Outputs</text>
  <text class="box-text" x="1222" y="316">Hourly, monthly, yearly</text>

  <rect class="box" x="1195" y="385" width="210" height="90"/>
  <text class="box-title" x="1222" y="423">Accuracy Metrics</text>
  <text class="box-text" x="1222" y="451">MAPE, MAE, bias</text>

  <rect class="box" x="1195" y="520" width="210" height="90"/>
  <text class="box-title" x="1222" y="558">Financial Metrics</text>
  <text class="box-text" x="1222" y="586">Value, savings, payback</text>

  <rect class="box" x="1195" y="655" width="210" height="90"/>
  <text class="box-title" x="1222" y="693">Comparisons</text>
  <text class="box-text" x="1222" y="721">Scenarios + benchmarks</text>

  <rect class="box" x="1530" y="270" width="170" height="105"/>
  <text class="box-title" x="1555" y="308">React / Vite</text>
  <text class="box-text" x="1555" y="336">Main web UI</text>
  <text class="tiny" x="1555" y="360">REST JSON calls</text>

  <rect class="box" x="1530" y="430" width="170" height="105"/>
  <text class="box-title" x="1555" y="468">Visuals</text>
  <text class="box-text" x="1555" y="496">Charts, KPIs,</text>
  <text class="tiny" x="1555" y="520">tables, warnings</text>

  <rect class="box" x="1530" y="590" width="170" height="105"/>
  <text class="box-title" x="1555" y="628">User Workflow</text>
  <text class="box-text" x="1555" y="656">Forecast, accuracy,</text>
  <text class="tiny" x="1555" y="680">methods, scenarios</text>

  <rect x="420" y="875" width="980" height="105" fill="#ffffff" stroke="#c4b5fd" stroke-width="2.5" rx="18" filter="url(#shadow)"/>
  <text class="box-title" x="455" y="914">FastAPI Backend Service Layer</text>
  <text class="box-text" x="455" y="945">Routers: /simulate, /forecast/yearly, /scenarios, /evaluation</text>
  <text class="tiny" x="455" y="970">Services: weather, archive, yearly forecast, simulation, ML, finance, accuracy, benchmark</text>

  <path class="arrow" d="M325 318 H455"/>
  <path class="arrow" d="M325 452 H455"/>
  <path class="arrow" d="M325 588 H455"/>
  <path class="arrow-soft" d="M325 723 H410 C430 723 437 675 455 675"/>

  <path class="arrow" d="M700 422 H830"/>
  <path class="arrow-soft" d="M700 552 H760 C790 552 790 465 830 465"/>
  <path class="arrow" d="M700 682 H830"/>

  <path class="arrow" d="M1055 305 H1180"/>
  <path class="arrow-soft" d="M1055 465 C1118 465 1120 306 1180 306"/>
  <path class="arrow-soft" d="M1055 625 C1125 625 1122 306 1180 306"/>

  <path class="arrow" d="M1405 295 H1515"/>
  <path class="arrow" d="M1405 430 H1515"/>
  <path class="arrow" d="M1405 565 H1515"/>
  <path class="arrow" d="M1405 700 H1515"/>

  <rect class="chip" x="90" y="910" width="280" height="50"/>
  <text class="box-text" x="115" y="942">External APIs + user configuration</text>

  <rect class="chip" x="1375" y="910" width="335" height="50"/>
  <text class="box-text" x="1400" y="942">Poster output: forecasts, graphs, KPIs</text>
</svg>
