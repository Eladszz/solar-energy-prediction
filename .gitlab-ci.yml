stages:
  - build
  - test
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG
  DOCKER_IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest
  DOCKER_DRIVER: overlay2
  DOCKERHUB_IMAGE: $DOCKERHUB_USERNAME/$CI_PROJECT_NAME:$CI_COMMIT_REF_SLUG
  DOCKERHUB_IMAGE_LATEST: $DOCKERHUB_USERNAME/$CI_PROJECT_NAME:latest

# Build Docker image
build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    # GitLab Container Registry
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    # Docker Hub (requires CI/CD variables: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN)
    - |
      if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
        echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      else
        echo "DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set; skipping Docker Hub login"
      fi
  script:
    - docker build -t $DOCKER_IMAGE -t $DOCKER_IMAGE_LATEST -t $DOCKERHUB_IMAGE -t $DOCKERHUB_IMAGE_LATEST .
    - docker push $DOCKER_IMAGE
    - docker push $DOCKER_IMAGE_LATEST
    - |
      if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
        docker push $DOCKERHUB_IMAGE
        docker push $DOCKERHUB_IMAGE_LATEST
      else
        echo "DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set; skipping Docker Hub push"
      fi
  only:
    - main
    - develop
    - tags

# Run backend tests
test:backend:
  stage: test
  image: python:3.11-slim
  before_script:
    - cd solar_backend
    - pip install --no-cache-dir -r backend_requirements.txt
  script:
    - pytest tests/ -v --tb=short --junitxml=test-results.xml --html=test-report.html --self-contained-html --cov=app --cov-report=term --cov-report=html --cov-report=xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      junit: solar_backend/test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: solar_backend/coverage.xml
    paths:
      - solar_backend/test-results.xml
      - solar_backend/test-report.html
      - solar_backend/htmlcov/
      - solar_backend/coverage.xml
    when: always
    expire_in: 30 days
  only:
    - main
    - develop
    - merge_requests

# Code quality check
lint:backend:
  stage: test
  image: python:3.11-slim
  before_script:
    - cd solar_backend
    - pip install --no-cache-dir ruff black
  script:
    - ruff check app/
    - black --check --diff app/
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

# Optional: generate Black-formatted output + diff artifact
format:backend:
  stage: test
  image: python:3.11-slim
  before_script:
    - cd solar_backend
    - pip install --no-cache-dir black
  script:
    # Produce a patch-like diff you can download from job artifacts
    - black --diff app/ > black.diff || true
    # Apply formatting inside CI workspace (does not commit/push)
    - black app/
    # Archive formatted sources for convenience
    - tar -czf black-formatted-app.tgz app/
  artifacts:
    paths:
      - solar_backend/black.diff
      - solar_backend/black-formatted-app.tgz
    when: always
    expire_in: 7 days
  when: manual
  allow_failure: true
  only:
    - main
    - develop
    - merge_requests

# Security scan
security:scan:
  stage: test
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker pull $DOCKER_IMAGE
    - |
      docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
        aquasec/trivy image --exit-code 0 --severity HIGH,CRITICAL $DOCKER_IMAGE
  allow_failure: true
  only:
    - main
    - develop

# Deploy to staging
deploy:staging:
  stage: deploy
  image: alpine:latest
  script:
    - |
      echo "========================================="
      echo "🚀 DEMO DEPLOYMENT TO STAGING"
      echo "========================================="
      echo "Environment: STAGING"
      echo "Docker Image: $DOCKER_IMAGE"
      echo "Branch: $CI_COMMIT_REF_NAME"
      echo "Commit: $CI_COMMIT_SHORT_SHA"
      echo ""
      echo "📦 Deployment steps (demo):"
      echo "  ✓ Pull latest Docker image"
      echo "  ✓ Stop existing container"
      echo "  ✓ Start new container"
      echo "  ✓ Backend API available at http://staging-server:8000"
      echo "  ✓ Frontend UI available at http://staging-server:8501"
      echo ""
      echo "✅ Demo staging deployment completed successfully!"
      echo "========================================="
  environment:
    name: staging
    url: http://staging-server:8501
  only:
    - develop

# Deploy to production
deploy:production:
  stage: deploy
  image: alpine:latest
  script:
    - |
      echo "========================================="
      echo "🚀 DEMO DEPLOYMENT TO PRODUCTION"
      echo "========================================="
      echo "Environment: PRODUCTION"
      echo "Docker Image: $DOCKER_IMAGE"
      echo "Branch: $CI_COMMIT_REF_NAME"
      echo "Commit: $CI_COMMIT_SHORT_SHA"
      echo ""
      echo "📦 Deployment steps (demo):"
      echo "  ✓ Pull latest Docker image"
      echo "  ✓ Stop existing container"
      echo "  ✓ Start new container"
      echo "  ✓ Backend API available at http://production-server:8000"
      echo "  ✓ Frontend UI available at http://production-server:8501"
      echo ""
      echo "⚡ Production deployment checklist:"
      echo "  ✓ All tests passed"
      echo "  ✓ Code quality verified"
      echo "  ✓ Security scan completed"
      echo "  ✓ Zero-downtime deployment"
      echo "  ✓ Health checks passed"
      echo ""
      echo "✅ Demo production deployment completed successfully!"
      echo "========================================="
  environment:
    name: production
    url: http://production-server:8501
  when: manual
  only:
    - main
    - tags
